name: Offline workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q airlift.py tools tests
      - name: Check launcher syntax
        run: bash -n 再次取消录音提示音.command 恢复录音提示音.command
